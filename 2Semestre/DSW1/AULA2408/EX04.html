<!DOCTYPE html>
<html>
    <head>
        <title>Cadastro de Clientes</title>
        <meta charset="utf-8">
    </head>
<body>
    <h2>Cadastro de Clientes</h2>
    <form action="EX04.php" method="POST">
        <table>
            <tr>
                <td>Nome:</td>
                <td><input type="text" name="nome" size="30" value=""></td>
            </tr>
            <tr>
                <td>Endereço:</td>
                <td><input type="text" name="endereco" size="30" value=""></td>
            </tr>
            <tr>
                <td>Cidade:</td>
                <td><input type="text" name="cidade" size="30" maxlength="60"></td>
            </tr>
            <tr>
                <td>
                    Sexo:
                </td>
                <td>
                    <input type="radio" name="sexo" value="Masculino" checked>Masculino
                    <input type="radio" name="sexo" value="Feminino">Feminino
                    <input type="radio" name="sexo" value="Feminino">Outro
                </td>
            <tr>
                <td>
                    <input type="reset" value="Limpar">
                </td>
                <td>
                    <input type="submit" value="Enviar">
                </td>
            </tr>
        </table>
    </form>

    <br>
    <a href="index.html">Voltar</a>
</body>
</html>
